{% extends 'base.html' %}
{% load static %}

{% block content %}
<main class="main">
    <div class="content">
        <div class="review-form-container">
            <h1 class="section-title">Редактирование отзыва</h1>

            <div class="edit-review-card">
                <form method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <label class="form-label">Ваша оценка:</label>
                        <div class="star-rating edit-stars">
                            {% for i in "12345" %}
                                <input type="radio" id="edit_star{{i}}" name="rating" value="{{i}}" {% if form.rating.value == i|stringformat:'i' %}checked{% endif %}>
                                <label for="edit_star{{i}}" class="star-label" title="{{i}}">
                                    <span class="star">★</span>
                                </label>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Текст отзыва:</label>
                        <textarea class="form-control review-textarea" name="content" rows="5" placeholder="Напишите ваш отзыв здесь...">{{ form.content.value }}</textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="auth save-btn">
                            <i class="fas fa-save"></i> Сохранить изменения
                        </button>
                        <a href="{% url 'about' %}" class="auth cancel-btn">
                            <i class="fas fa-times"></i> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<style>
    /* Общие стили */
    .main {
        background: linear-gradient(to bottom, #f0f4f7, #e8ebee);
        padding: 50px 0;
    }

    .content {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .review-form-container {
        text-align: center;
    }

    .section-title {
        font-size: 32px;
        color: #34495e;
        margin-bottom: 30px;
        position: relative;
        display: inline-block;
        padding-bottom: 10px;
    }

    .section-title:after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        height: 4px;
        width: 70px;
        background-color: #2ecc71;
        border-radius: 5px;
    }

    /* Карточка отзыва */
    .edit-review-card {
        background: #fff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        margin: 30px auto;
        max-width: 700px;
        border: 1px solid #ecf0f1;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .edit-review-card:hover {
        transform: translateY(-7px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
    }

    /* Форма */
    .form-group {
        margin-bottom: 25px;
        text-align: left;
    }

    .form-label {
        display: block;
        margin-bottom: 12px;
        color: #34495e;
        font-weight: 600;
        font-size: 17px;
    }

    .review-textarea {
        min-height: 160px;
        border: 2px solid #d9d9d9;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        font-size: 16px;
        padding: 15px;
        border-radius: 8px;
        width: 100%;
        box-sizing: border-box;
        color: #555;
    }

    .review-textarea:focus {
        border-color: #3498db;
        box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
        outline: none;
    }

    /* Звезды рейтинга */
    .star-rating {
        display: flex;
        gap: 8px;
        margin: 20px 0;
        justify-content: flex-start;
        direction: ltr;
    }

    .star-rating input[type="radio"] {
        display: none;
    }

    .star-label {
        color: #ddd;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.2s ease;
        font-size: 34px;
    }

    .star-label:hover,
    .star-label:hover ~ .star-label {
        color: #f39c12;
        transform: scale(1.1);
    }

    .star-rating input[type="radio"]:checked + .star-label {
        color: #f39c12;
    }

    .star {
        display: inline-block; /* Убедитесь, что звезда занимает место */
    }

    /* Кнопки действий */
    .form-actions {
        display: flex;
        gap: 20px;
        margin-top: 35px;
        justify-content: center;
    }

    .auth {
        background: #3498db;
        color: #fff;
        padding: 14px 40px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        text-decoration: none;
        font-weight: 500;
        font-size: 16px;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
    }

    .auth:hover {
        background-color: #2980b9;
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
    }

    .save-btn {
        background: #2ecc71;
        box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
    }

    .save-btn:hover {
        background-color: #27ae60;
        box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
    }

    .cancel-btn {
        background: #e74c3c;
        box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
    }

    .cancel-btn:hover {
        background-color: #c0392b;
        box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
    }

    /* Адаптивность */
    @media (max-width: 768px) {
        .content {
            padding: 0 15px;
        }

        .edit-review-card {
            padding: 30px;
            margin: 20px auto;
        }

        .form-label {
            font-size: 16px;
        }

        .review-textarea {
            font-size: 15px;
        }

        .star-rating {
            gap: 6px;
            margin: 15px 0;
        }

        .star-label {
            font-size: 30px;
        }

        .form-actions {
            flex-direction: column;
            gap: 15px;
        }

        .auth {
            width: 100%;
            justify-content: center;
            padding: 12px 30px;
            font-size: 15px;
        }
    }
</style>
{% endblock %}
