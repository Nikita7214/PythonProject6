{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center" style="color: #6f4c3e;">Регистрация</h1>
    <hr>

  {% for message in messages %}
{% if 'registration' in message.tags %}
<div class="alert alert-{{ message.tags }} alert-dismissible fade show">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endif %}
{% endfor %}


    <div class="col-md-8 mx-auto p-4 rounded shadow" style="background-color: #ffffff;">
        <form method="post" action="{% url 'registration' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Имя пользователя</label>
                <input type="text" name="username" class="form-control" required minlength="3" placeholder="Введите имя пользователя">
            </div>
            <div class="mb-3">
                <label class="form-label">Электронная почта</label>
                <input type="email" name="email" class="form-control" required placeholder="Введите email">
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password1" class="form-control" required minlength="4" placeholder="Введите пароль">
            </div>
            <div class="mb-3">
                <label class="form-label">Подтвердите пароль</label>
                <input type="password" name="password2" class="form-control" required minlength="4" placeholder="Подтвердите пароль">
            </div>
          <div class="d-grid col-md-8 mx-auto gap-3">
    <button type="submit" class="btn btn-lg w-100 py-3" style="background-color: #6f4c3e; color: white; border: none; margin-bottom: 10px;">Зарегистрироваться</button>
    <a href="/" class="btn btn-lg w-100 py-3 text-center" style="background-color: #6f4c3e; color: white; border: none; text-decoration: none; margin-bottom: 10px;">Вернуться назад</a>
</div>

        </form>

        <!-- Добавленная ссылка для входа -->
        <div class="text-center mt-4">
            <span class="me-2">Уже есть аккаунт?</span>
            <a href="{% url 'login' %}" style="color: #6f4c3e; font-weight: bold; text-decoration: none;">Войти</a>
        </div>
    </div>
</div>
{% endblock %}
